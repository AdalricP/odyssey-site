<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Odyssey</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }

  .layer {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* bottom layer — black/night version, revealed by brush */
  .night {
    object-fit: cover;
    object-position: center;
    z-index: 0;
  }

  /* top layer — parchment painted onto canvas so it can be erased */
  #brush {
    z-index: 1;
    display: block;
    cursor: crosshair;
  }

  .logo {
    position: fixed;
    top: 38px;
    left: 50%;
    transform: translateX(-50%) translateY(8px);
    z-index: 3;
    width: 200px;
    height: auto;
    opacity: 0;
    animation: logoFade 1400ms 200ms cubic-bezier(.2,.7,.2,1) forwards;
    pointer-events: none;
  }

  @keyframes logoFade {
    to { opacity: 1; transform: translateX(-50%) translateY(0); }
  }

  @media (max-width: 640px) {
    .logo { width: 150px; top: 22px; }
  }
</style>
</head>
<body>

<img class="layer night" src="bg_black.png" alt="" />
<canvas id="brush" class="layer"></canvas>

<script>
(() => {
  const canvas = document.getElementById('brush');
  const ctx = canvas.getContext('2d');
  let dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = 0, h = 0;
  let imgReady = false;

  const parchment = new Image();
  parchment.src = 'bg.png';

  const pointer = { x: -1, y: -1, prevX: -1, prevY: -1, down: false };

  function coverRect(iw, ih, cw, ch) {
    // larger overscan + symmetric pad covers the canvas even with DPR
    // sub-pixel rounding at the right/bottom edges
    const r = Math.max(cw / iw, ch / ih) * 1.10;
    const dw = iw * r, dh = ih * r;
    return { x: (cw - dw) / 2, y: (ch - dh) / 2, w: dw, h: dh };
  }

  function paintParchment(alpha) {
    if (!imgReady) return;
    ctx.globalAlpha = alpha;
    // cream fallback fill so canvas pixels are never transparent at the
    // edges — prevents the night layer from bleeding through any tiny gap
    ctx.fillStyle = '#e8d5a4';
    ctx.fillRect(-2, -2, w + 4, h + 4);
    const r = coverRect(parchment.width, parchment.height, w, h);
    ctx.drawImage(parchment, r.x, r.y, r.w, r.h);
    ctx.globalAlpha = 1;
  }

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width = Math.round(w * dpr);
    canvas.height = Math.round(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, w, h);
    paintParchment(1);
  }

  parchment.onload = () => {
    imgReady = true;
    resize();
    requestAnimationFrame(frame);
  };

  // brush stamp — several soft dabs with jitter for a bristle feel
  function stamp(x, y) {
    const dabs = 5;
    for (let i = 0; i < dabs; i++) {
      const jx = x + (Math.random() - 0.5) * 28;
      const jy = y + (Math.random() - 0.5) * 28;
      const r = 38 + Math.random() * 38;
      const g = ctx.createRadialGradient(jx, jy, 0, jx, jy, r);
      g.addColorStop(0,    'rgba(0,0,0,0.55)');
      g.addColorStop(0.45, 'rgba(0,0,0,0.22)');
      g.addColorStop(1,    'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(jx, jy, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function processStrokes() {
    if (!pointer.down || pointer.prevX < 0) return;
    const dx = pointer.x - pointer.prevX;
    const dy = pointer.y - pointer.prevY;
    const dist = Math.hypot(dx, dy);
    const steps = Math.max(1, Math.ceil(dist / 10));
    ctx.globalCompositeOperation = 'destination-out';
    for (let i = 1; i <= steps; i++) {
      const t = i / steps;
      stamp(pointer.prevX + dx * t, pointer.prevY + dy * t);
    }
    if (dist < 1) stamp(pointer.x, pointer.y);
    ctx.globalCompositeOperation = 'source-over';
    pointer.prevX = pointer.x;
    pointer.prevY = pointer.y;
  }

  function frame() {
    processStrokes();
    // pause regen while brushing so paint holds; ~1s fade once released
    if (!pointer.down) paintParchment(0.10);
    requestAnimationFrame(frame);
  }

  function onPointerDown(e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
    pointer.prevX = pointer.x;
    pointer.prevY = pointer.y;
    pointer.down = true;
  }
  function onPointerMove(e) {
    pointer.x = e.clientX;
    pointer.y = e.clientY;
  }
  function onPointerUp() {
    pointer.down = false;
    pointer.prevX = -1;
    pointer.prevY = -1;
  }

  window.addEventListener('resize', resize);
  window.addEventListener('pointerdown', onPointerDown, { passive: true });
  window.addEventListener('pointermove', onPointerMove, { passive: true });
  window.addEventListener('pointerup', onPointerUp, { passive: true });
  window.addEventListener('pointercancel', onPointerUp, { passive: true });
  window.addEventListener('pointerleave', onPointerUp);
})();
</script>
